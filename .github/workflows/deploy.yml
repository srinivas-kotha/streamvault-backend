name: Deploy

on:
  workflow_run:
    workflows: ["Validate"]
    types: [completed]
    branches: [main]

# Serialize prod deploys so two pushes can't stomp each other's snapshots
# (per master plan R23 / grill #8).
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v5

      - name: Deploy via streamvault-deploy.sh
        # New deploy path (PR-OPS-1): snapshot → deploy → smoke → auto-rollback.
        # The script is idempotent and emits a manifest at /home/crawler/snapshots/.
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          timeout: 60s
          command_timeout: 12m
          envs: POSTGRES_USER,POSTGRES_DB
          script: |
            set -euo pipefail
            export POSTGRES_USER='${{ secrets.POSTGRES_USER }}'
            export POSTGRES_DB='${{ secrets.POSTGRES_DB }}'
            cd ~/streamvault-backend && git checkout -- . && git pull --rebase origin main
            cd ~/streamvault-v3-frontend && git checkout -- . && git pull --rebase origin main
            chmod +x ~/streamvault-backend/bin/*.sh ~/streamvault-backend/bin/lib/*.sh
            bash ~/streamvault-backend/bin/streamvault-deploy.sh

      - name: Cleanup unprotected images
        if: success()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          timeout: 60s
          command_timeout: 8m
          # Only prune images with no streamvault.protect label. The deploy
          # script tags last-N smoke-passed images so they survive prune.
          script: |
            docker image prune -f --filter "label!=streamvault.protect=true"
